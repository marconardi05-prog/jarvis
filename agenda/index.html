<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1110" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Agenda">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Agenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app a colonna unica (max 560px). Testata vetro con mese, filtro Tutto/Lavoro/Personale e striscia settimana;
   contenuto; barra schede fissa in basso (Giorno, Settimana, +, Mese, Clienti). Fogli dal basso per editor e schede. */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --sunk:#e8ece8; --ink:#141c19; --muted:#5f6c67; --line:#dfe4e0;
  --accent:#0e6b5c; --accent-ink:#ffffff; --today:#e0552d; --ok:#1f8a4c; --warn:#c27a00;
  --c-personale:#0e8a74; --c-lavoro:#3c5a80; --c-famiglia:#e0552d; --c-amici:#c98a00; --c-salute:#d23c62; --c-sport:#2f6fd8; --c-casa:#7b57d1; --c-altro:#6c7772;
  --display:"Bricolage Grotesque","Avenir Next Condensed",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px; --shadow:0 1px 2px rgba(20,28,25,.05),0 4px 14px rgba(20,28,25,.05);
  --glass:rgba(243,245,242,.84);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1110; --surface:#151d1b; --sunk:#111816; --ink:#e8efeb; --muted:#8d9b96; --line:#232e2b;
  --accent:#43c4a9; --accent-ink:#04211b; --today:#ff7a52; --ok:#4fd18a; --warn:#f2b72f;
  --c-personale:#43c4a9; --c-lavoro:#9dbbe0; --c-famiglia:#ff7a52; --c-amici:#f2b72f; --c-salute:#ff6d8f; --c-sport:#6ea6ff; --c-casa:#ac8dff; --c-altro:#9aa6a1;
  --shadow:0 1px 2px rgba(0,0,0,.3); --glass:rgba(11,17,16,.84); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0b1110; --surface:#151d1b; --sunk:#111816; --ink:#e8efeb; --muted:#8d9b96; --line:#232e2b;
  --accent:#43c4a9; --accent-ink:#04211b; --today:#ff7a52; --ok:#4fd18a; --warn:#f2b72f;
  --c-personale:#43c4a9; --c-lavoro:#9dbbe0; --c-famiglia:#ff7a52; --c-amici:#f2b72f; --c-salute:#ff6d8f; --c-sport:#6ea6ff; --c-casa:#ac8dff; --c-altro:#9aa6a1;
  --shadow:0 1px 2px rgba(0,0,0,.3); --glass:rgba(11,17,16,.84); color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent;min-height:100%;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tint{background:color-mix(in srgb,var(--k) 13%,var(--surface))}

/* ---------- testata ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);padding-top:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
html{padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;gap:8px;padding:2px 0 4px}
.month{flex:1;min-width:0;text-align:left;background:none;border:0;padding:4px 0;display:flex;align-items:baseline;gap:8px;color:var(--ink)}
.month b{font:800 30px/1 var(--display);letter-spacing:-.03em;text-transform:capitalize;white-space:nowrap}
.month span{font:500 15px var(--body);color:var(--muted)}
.month svg{width:14px;height:14px;color:var(--muted);align-self:center;flex:none}
.pill{height:36px;border-radius:18px;border:0;background:var(--surface);box-shadow:var(--shadow),0 0 0 1px var(--line);padding:0 14px;font-weight:600;font-size:14px;flex:none;color:var(--ink)}
.pill.on{background:var(--ink);color:var(--bg);box-shadow:none}
.iconb{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow),0 0 0 1px var(--line);display:grid;place-items:center;padding:0;flex:none;color:var(--ink)}
.iconb svg{width:18px;height:18px}
.area{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:12px;padding:3px;margin-top:6px}
.area button{border:0;background:none;padding:7px 0;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.area button svg{width:15px;height:15px}
.area button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.area button[data-a="lavoro"][aria-pressed="true"]{color:var(--c-lavoro)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:8px 0 12px}
.wd{border:0;background:none;padding:8px 0 7px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;transition:background .2s;color:var(--ink)}
.wd .d{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.wd .n{font:700 19px/1 var(--display);font-variant-numeric:tabular-nums}
.wd .dots{display:flex;gap:3px;height:5px}
.wd .dots i{width:5px;height:5px;border-radius:50%}
.wd.today .n,.wd.today .d{color:var(--today)}
.wd.sel{background:var(--ink)}
.wd.sel .d,.wd.sel .n{color:var(--bg)}
.wd.sel.today{background:var(--today)}
.wd.sel.today .d,.wd.sel.today .n{color:#fff}
.wd.sel .dots i{box-shadow:0 0 0 1.5px var(--ink)}
.wd.sel.today .dots i{box-shadow:0 0 0 1.5px var(--today)}
.hair{height:1px;background:var(--line)}

main{padding-top:14px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 120px)}
.fade{animation:fade .28s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}

/* ---------- copertina del giorno ---------- */
.cover{position:relative;overflow:hidden;border-radius:26px;padding:20px 20px 18px;color:#fff;background:var(--g);box-shadow:0 10px 30px -12px color-mix(in srgb,var(--g1) 70%,transparent)}
.cover::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),rgba(255,255,255,0) 70%);pointer-events:none}
.cover .stars{position:absolute;inset:0;pointer-events:none;opacity:.7;background-image:radial-gradient(1.2px 1.2px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 20%,#fff,transparent),radial-gradient(1.4px 1.4px at 85% 60%,#fff,transparent),radial-gradient(1px 1px at 40% 75%,#fff,transparent),radial-gradient(1px 1px at 55% 45%,#fff,transparent),radial-gradient(1.2px 1.2px at 10% 85%,#fff,transparent)}
.cover .eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.9;display:flex;align-items:center;gap:8px;position:relative}
.cover .eyebrow em{font-style:normal;background:rgba(255,255,255,.22);padding:3px 8px;border-radius:999px;letter-spacing:.08em}
.cover .main{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:6px;position:relative}
.cover .big{font:800 96px/.8 var(--display);letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.cover .wk{font:700 26px/1.05 var(--display);letter-spacing:-.02em;text-transform:capitalize;margin-top:10px}
.cover .my{opacity:.85;text-transform:capitalize;font-size:15px}
.ring{width:84px;height:84px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.ring .lbl b{font:800 22px var(--display);display:block}
.ring .lbl small{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px;position:relative}
.chips span{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

h2{font:700 20px/1 var(--display);letter-spacing:-.02em;margin:30px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
h2 small{font:500 13px var(--body);color:var(--muted);letter-spacing:0}
h2 button{border:0;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font:700 13px var(--body);border-radius:999px;padding:7px 12px;white-space:nowrap}

/* riepilogo */
.brief{margin-top:14px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow),0 0 0 1px var(--line);padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.brief .ic{--k:var(--accent)}
.brief b{display:block;font:700 17px var(--display);letter-spacing:-.01em;margin-bottom:2px}
.brief p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.5}
.brief p strong{color:var(--ink);font-weight:600}

/* ---------- linea del tempo ---------- */
.allday{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.ad{display:flex;align-items:center;gap:12px;border:0;width:100%;text-align:left;border-radius:16px;padding:10px 14px 10px 10px;color:var(--ink)}
.ad .ic{width:34px;height:34px}
.ad .ti{font-weight:700;flex:1;min-width:0;overflow-wrap:anywhere}
.ad .tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--k) 75%,var(--ink))}
.tl{display:grid;grid-template-columns:46px 20px 1fr;column-gap:8px}
.tl>*{min-width:0}
.tl .time{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;text-align:right;padding-top:14px;line-height:1.2}
.tl .time small{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.tl .time.nowt{color:var(--today);padding-top:4px}
.tl .rail{position:relative;display:flex;justify-content:center}
.tl .rail::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line);border-radius:1px}
.tl .rail.first::before{top:20px}
.tl .rail.last::before{bottom:calc(100% - 20px)}
.tl .rail i{position:relative;margin-top:15px;width:12px;height:12px;border-radius:50%;background:var(--k);box-shadow:0 0 0 4px var(--bg)}
.tl .rail.nowr i{background:var(--today);margin-top:7px;box-shadow:0 0 0 4px color-mix(in srgb,var(--today) 25%,var(--bg));animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--today) 12%,var(--bg))}}
.nowline{display:flex;align-items:center;padding:6px 0}
.nowline::before{content:"";flex:1;height:2px;background:var(--today);border-radius:1px}
.nowline span{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--today);margin-left:8px}
.card{margin:4px 0;border:0;width:100%;text-align:left;border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:flex-start;color:var(--ink);min-width:0}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--k) 22%,var(--surface));color:color-mix(in srgb,var(--k) 85%,var(--ink))}
.ic svg{width:19px;height:19px}
.card .b{min-width:0;flex:1}
.card .ti{font-weight:700;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.card .sub{font-size:13px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px}
.card .sub span{display:inline-flex;align-items:center;gap:4px;min-width:0}
.card .sub svg{width:13px;height:13px;flex:none}
.card .dur{font-size:12px;font-weight:700;color:color-mix(in srgb,var(--k) 80%,var(--ink));white-space:nowrap;padding-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag2{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 8px;background:color-mix(in srgb,var(--k) 16%,var(--surface));color:color-mix(in srgb,var(--k) 85%,var(--ink));white-space:nowrap}
.tag2.need{--k:var(--today)}
.tag2.ok{--k:var(--ok)}
.tag2.wait{--k:var(--warn)}
.tag2.no{--k:var(--c-altro)}
.past .card,.time.past{opacity:.55}
.rail.past i{background:var(--muted)}
.gap{font-size:12.5px;color:var(--muted);padding:6px 2px;display:flex;align-items:center;gap:6px}
.gap::before{content:"";width:14px;height:1px;background:var(--muted);opacity:.6}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 18px;color:var(--muted);text-align:center;background:none;width:100%}
.empty svg{width:34px;height:34px;color:var(--accent);margin-bottom:6px}
.empty b{display:block;color:var(--ink);font:700 18px var(--display);margin-bottom:2px}

/* ---------- da fare ---------- */
.tasks{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow),0 0 0 1px var(--line);overflow:hidden}
.task{display:flex;align-items:center;gap:12px;padding:12px 8px 12px 14px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:50%;border:2px solid color-mix(in srgb,var(--muted) 70%,transparent);margin:0;flex:none;display:grid;place-items:center;cursor:pointer;transition:all .15s}
.task input:checked{background:var(--accent);border-color:var(--accent)}
.task input:checked::after{content:"";width:5px;height:10px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.task .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.task .tx small{display:block;font-size:12.5px;color:var(--muted)}
.task .tx small button{border:0;background:none;padding:0;color:var(--c-lavoro);font-weight:700;font-size:12.5px}
.task.done .tx>span{text-decoration:line-through;color:var(--muted)}
.task .wk{width:16px;height:16px;color:var(--c-lavoro);flex:none}
.task .from{font-size:11px;color:var(--today);font-weight:700;white-space:nowrap;background:color-mix(in srgb,var(--today) 12%,transparent);padding:3px 7px;border-radius:999px}
.task .from.fut{color:var(--muted);background:var(--sunk)}
.task .x{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:10px;font-size:20px;line-height:1;flex:none;opacity:.6}
.addt{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;border-top:1px solid var(--line)}
.tasks>.addt:first-child{border-top:0}
.addt .plus{width:24px;height:24px;border-radius:50%;border:2px dashed color-mix(in srgb,var(--muted) 60%,transparent);flex:none}
.addt input{flex:1;min-width:0;border:0;background:none;padding:6px 0;outline:none}
.addt .who{border:0;border-radius:9px;padding:6px 8px;font-size:12px;font-weight:700;background:var(--sunk);color:var(--muted);white-space:nowrap}
.addt .who.w{background:color-mix(in srgb,var(--c-lavoro) 16%,var(--surface));color:var(--c-lavoro)}
.addt button.go{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:7px 12px;font-weight:700;font-size:14px}
textarea.note{width:100%;min-height:120px;resize:vertical;border:0;background:var(--surface);box-shadow:var(--shadow),0 0 0 1px var(--line);border-radius:var(--r);padding:14px 16px;line-height:1.55;
  background-image:repeating-linear-gradient(transparent 0 calc(1.55em - 1px),color-mix(in srgb,var(--line) 70%,transparent) calc(1.55em - 1px) 1.55em);background-attachment:local;background-position:0 14px}
.saved{font:500 13px var(--body);color:var(--muted)}

/* ---------- settimana ---------- */
.wkl{display:flex;flex-direction:column;gap:10px}
.wkday{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:14px;border-radius:var(--r);text-align:left;width:100%;background:var(--surface);border:0;box-shadow:var(--shadow),0 0 0 1px var(--line);color:var(--ink)}
.wkday.today{box-shadow:0 0 0 2px var(--today)}
.wkday.weekend{background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.wkday .num{font:800 34px/.9 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.wkday .num small{display:block;font:700 11px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:6px}
.wkday.today .num{color:var(--today)}
.wkday .its{display:flex;flex-direction:column;gap:6px;min-width:0}
.wkday .it{display:flex;gap:8px;align-items:center;min-width:0;font-size:14.5px;border-radius:10px;padding:6px 9px;background:color-mix(in srgb,var(--k) 13%,var(--surface))}
.wkday .it i{width:4px;align-self:stretch;border-radius:2px;background:var(--k);flex:none}
.wkday .it b{font-weight:700;font-variant-numeric:tabular-nums;flex:none;font-size:13.5px}
.wkday .it span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.wkday .free{color:var(--muted);font-size:14px;padding:6px 0}
.wkday .tc{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;padding-left:2px}
.wkday .tc::before{content:"";width:11px;height:11px;border-radius:50%;border:1.5px solid var(--muted)}
.wsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.wsum div{background:var(--surface);border-radius:14px;box-shadow:0 0 0 1px var(--line);padding:10px 12px}
.wsum b{display:block;font:800 26px/1 var(--display);font-variant-numeric:tabular-nums}
.wsum span{font-size:12px;color:var(--muted)}

/* ---------- mese ---------- */
.mhead{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.mhead div{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-align:center}
.mhead div:nth-child(n+6){color:var(--today)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mc{aspect-ratio:1/1.18;max-width:100%;border:0;background:var(--surface);border-radius:14px;padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 0 0 1px var(--line);min-width:0;overflow:hidden;color:var(--ink)}
.mc .n{font:700 16px/1 var(--display);width:26px;height:26px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums;flex:none}
.mc .bars{display:flex;flex-direction:column;gap:2px;width:100%;padding:0 3px}
.mc .bars i{height:4px;border-radius:2px;background:var(--k)}
.mc .more{font-size:9px;font-weight:700;color:var(--muted);line-height:1}
.mc.out{background:none;box-shadow:none;opacity:.32}
.mc.today .n{background:var(--today);color:#fff}
.mc.sel{background:var(--ink);box-shadow:none}
.mc.sel .n{color:var(--bg)}
.mc.sel.today .n{background:var(--today);color:#fff}
.mc.sel .bars i{box-shadow:0 0 0 1px var(--ink)}
.mlist{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;gap:12px;align-items:center;border:0;width:100%;text-align:left;border-radius:16px;padding:11px 14px 11px 11px;color:var(--ink)}
.mrow .ti{font-weight:700;flex:1;min-width:0;overflow-wrap:anywhere}
.mrow .tm{font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;color:color-mix(in srgb,var(--k) 80%,var(--ink));white-space:nowrap}

/* ---------- clienti ---------- */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;box-shadow:0 0 0 1px var(--line);padding:0 12px;margin-top:4px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;padding:12px 0;outline:none}
.clist{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow),0 0 0 1px var(--line);overflow:hidden}
.crow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:12px 14px;border-top:1px solid var(--line);color:var(--ink)}
.crow:first-child{border-top:0}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;font:700 15px var(--display);color:#fff;background:var(--k)}
.av.big{width:64px;height:64px;font-size:24px}
.crow .b{flex:1;min-width:0}
.crow b{display:block;font-weight:700;overflow-wrap:anywhere}
.crow .b>span{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .chev{width:16px;height:16px;color:var(--muted);flex:none}
.letter{font:700 13px var(--body);color:var(--muted);letter-spacing:.08em;margin:16px 4px 6px}
.callb{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;box-shadow:0 0 0 1px var(--line);padding:10px 12px;margin-top:8px}
.callb .b{flex:1;min-width:0}
.callb b{display:block;font-weight:700;overflow-wrap:anywhere}
.callb .b>span{font-size:13px;color:var(--muted)}
.callb.late{box-shadow:0 0 0 1.5px var(--today)}
.callb.late .b>span{color:var(--today);font-weight:600}
.mini{border:0;border-radius:10px;padding:8px 10px;font-weight:700;font-size:13px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.mini svg{width:15px;height:15px}
.chead{display:flex;align-items:center;gap:14px;margin-top:4px}
.chead h3{margin:0;font:800 26px/1.1 var(--display);letter-spacing:-.02em;overflow-wrap:anywhere}
.chead p{margin:2px 0 0;color:var(--muted);font-size:14px}
.cacts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.cact{border:0;border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:700;background:var(--surface);box-shadow:0 0 0 1px var(--line);color:var(--ink);text-decoration:none;text-align:center}
.cact svg{width:20px;height:20px;color:var(--accent)}
.cact[aria-disabled="true"]{opacity:.4;pointer-events:none}
.info{background:var(--surface);border-radius:16px;box-shadow:0 0 0 1px var(--line);margin-top:12px;overflow:hidden}
.info div{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;border-top:1px solid var(--line);font-size:15px}
.info div:first-child{border-top:0}
.info span{color:var(--muted)}
.info b{font-weight:600;text-align:right;overflow-wrap:anywhere;min-width:0}
.hist{display:flex;flex-direction:column;gap:8px}

/* ---------- barra schede ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 6px) max(10px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:11px;font-weight:600}
.tab svg{width:24px;height:24px}
.tab[aria-pressed="true"]{color:var(--accent)}
.add{justify-self:center;width:58px;height:58px;border-radius:20px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-26px;
  box-shadow:0 10px 24px -6px color-mix(in srgb,var(--accent) 60%,transparent),0 0 0 5px var(--bg)}
.add svg{width:26px;height:26px}

/* ---------- fogli ---------- */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(5,10,9,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 22px) max(18px,env(safe-area-inset-left,0px));animation:up .24s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.shead h3{margin:0;font:800 24px var(--display);letter-spacing:-.02em}
.shead button{border:0;background:none;font-weight:600;color:var(--muted);padding:8px 0}
.group{background:var(--surface);border-radius:16px;box-shadow:0 0 0 1px var(--line);margin-top:12px;overflow:hidden}
.grow{display:flex;align-items:center;gap:12px;padding:4px 14px;min-height:52px;border-top:1px solid var(--line)}
.grow:first-child{border-top:0}
.grow>span{flex:1;font-weight:500;min-width:0}
.grow input[type=date],.grow input[type=time],.grow select{border:0;background:var(--sunk);border-radius:10px;padding:8px 10px;-webkit-appearance:none;appearance:none;font-weight:600;min-width:0;max-width:60%}
.grow input.txt{border:0;background:none;flex:1;padding:12px 0;outline:none;min-width:0}
.grow svg{width:18px;height:18px;color:var(--muted);flex:none}
.group.work{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--c-lavoro) 60%,transparent)}
.group.work .ghead{display:flex;align-items:center;gap:8px;padding:10px 14px 6px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--c-lavoro)}
.group.work .ghead svg{width:15px;height:15px}
.group.work .grow:nth-child(2){border-top:0}
input.title{width:100%;border:0;background:none;font:800 26px var(--display);letter-spacing:-.02em;padding:10px 2px 6px;outline:none}
input.title::placeholder{color:color-mix(in srgb,var(--muted) 70%,transparent)}
.sw{width:50px;height:30px;-webkit-appearance:none;appearance:none;background:var(--line);border-radius:15px;position:relative;margin:0;cursor:pointer;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw:checked{background:var(--accent)}
.sw:checked::after{transform:translateX(20px)}
.lab{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:18px 2px 8px;display:block}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.cat{border:0;border-radius:14px;padding:10px 6px;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.cat .ic{width:34px;height:34px}
.cat[aria-pressed="true"]{background:color-mix(in srgb,var(--k) 15%,var(--surface));box-shadow:0 0 0 2px var(--k)}
.chipsel{display:flex;flex-wrap:wrap;gap:6px}
.chipsel button{border:0;border-radius:999px;padding:8px 12px;font-size:13.5px;font-weight:600;background:var(--surface);box-shadow:0 0 0 1px var(--line);color:var(--ink)}
.chipsel button[aria-pressed="true"]{background:var(--c-lavoro);color:#fff;box-shadow:none}
textarea.in{width:100%;border:0;background:var(--surface);box-shadow:0 0 0 1px var(--line);border-radius:16px;padding:12px 14px;min-height:80px;resize:vertical}
.acts{display:flex;gap:10px;margin-top:22px}
.btn{flex:1;border:0;border-radius:16px;padding:16px;font-weight:700;background:var(--sunk);color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.del{background:none;color:var(--today);flex:0 0 auto;padding:16px 8px}
.btn.ghost{background:none;box-shadow:0 0 0 1px var(--line);margin-top:10px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost svg{width:18px;height:18px}
.confirm{margin-top:14px;padding:14px;border-radius:16px;background:var(--surface);box-shadow:0 0 0 1.5px var(--today)}
.confirm p{margin:0 0 10px;font-weight:700}
.confirm .acts{margin-top:0;flex-wrap:wrap}
.confirm .btn{flex:1 1 140px}
.btn.warn{background:var(--today);color:#fff}
.menu .btn{display:flex;gap:14px;align-items:center;width:100%;text-align:left;margin-top:10px;background:var(--surface);box-shadow:0 0 0 1px var(--line);font-weight:700}
.menu .btn>span:nth-child(2){flex:1;min-width:0}
.menu .btn small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
.menu .btn .ic{--k:var(--accent)}
.menu .btn.danger .ic{--k:var(--today)}
.status{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.status.on{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.status.off{background:var(--sunk);color:var(--muted)}
.foot{margin-top:18px;font-size:13px;color:var(--muted)}
.alarm{position:fixed;z-index:50;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);width:min(560px,calc(100% - 24px));
  background:var(--ink);color:var(--bg);border-radius:20px;padding:14px 14px 14px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 18px 40px -10px rgba(0,0,0,.45);animation:drop .35s cubic-bezier(.2,.9,.2,1.2)}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}}
.alarm .ic{--k:var(--today);background:var(--today);color:#fff;animation:ring 1s ease-in-out 3}
@keyframes ring{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.alarm .b{flex:1;min-width:0}
.alarm b{display:block;font:700 17px var(--display);overflow-wrap:anywhere}
.alarm span{font-size:14px;opacity:.75}
.alarm button{border:0;background:var(--bg);color:var(--ink);font-weight:700;border-radius:12px;padding:10px 14px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:60;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast button{background:none;border:0;color:inherit;font-weight:800;text-decoration:underline;margin-left:10px;padding:0}
#toast.act{pointer-events:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <button class="month" id="monthBtn" aria-label="Apri vista mese"></button>
      <button class="pill" id="todayBtn">Oggi</button>
      <button class="iconb" id="menuBtn" aria-label="Impostazioni e backup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>
    </div>
    <div class="area" role="group" aria-label="Mostra">
      <button data-a="tutto">Tutto</button>
      <button data-a="lavoro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8.5 7V5.5a2 2 0 012-2h3a2 2 0 012 2V7"/></svg>Lavoro</button>
      <button data-a="personale"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5L12 3.5l8.5 7V20a1 1 0 01-1 1h-15a1 1 0 01-1-1z"/></svg>Personale</button>
    </div>
    <nav class="week" id="week" aria-label="Settimana"></nav>
  </div>
  <div class="hair"></div>
</header>

<main class="wrap" id="view"></main>

<nav class="tabs" aria-label="Viste">
  <div class="in">
    <button class="tab" data-v="giorno"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="16" rx="4"/><path d="M8 2.5v4M16 2.5v4M3.5 9.5h17"/><circle cx="12" cy="15" r="1.6" fill="currentColor"/></svg>Giorno</button>
    <button class="tab" data-v="settimana"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Settimana</button>
    <button class="add" id="fab" aria-label="Nuovo appuntamento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tab" data-v="mese"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3.5" y="4.5" width="17" height="16" rx="4"/><path d="M3.5 9.5h17M9 9.5v11M15 9.5v11M3.5 15h17"/></svg>Mese</button>
    <button class="tab" data-v="clienti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0113 0"/><path d="M16 4.6a3.5 3.5 0 010 6.8M18.5 14a6.5 6.5 0 013 6"/></svg>Clienti</button>
  </div>
</nav>

<!-- editor appuntamento -->
<div class="scrim" id="edScrim" hidden>
  <form class="sheet" id="ed" autocomplete="off" novalidate>
    <div class="grab"></div>
    <div class="shead"><h3 id="edTitle">Nuovo</h3><button type="button" id="edClose">Annulla</button></div>
    <input class="title" id="fTitle" placeholder="Cosa devi fare?" aria-label="Titolo">
    <span class="lab" style="margin-top:8px">Categoria</span>
    <div class="cats" id="fCats"></div>

    <div class="group work" id="workBox" hidden>
      <div class="ghead"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8.5 7V5.5a2 2 0 012-2h3a2 2 0 012 2V7"/></svg>Appuntamento di lavoro</div>
      <label class="grow"><span>Cliente</span><select id="fClient"></select></label>

      <label class="grow" id="newCliRow2" hidden><input class="txt" id="fNewPhone" type="tel" placeholder="Telefono (facoltativo)"></label>
      <label class="grow"><span>Tema</span><select id="fTema"></select></label>
      <label class="grow"><span>Sede</span><select id="fSede"></select></label>
      <label class="grow" id="esitoRow"><span>Esito</span><select id="fEsito"></select></label>
    </div>

    <div class="group">
      <label class="grow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg><span>Tutto il giorno</span><input type="checkbox" class="sw" id="fAll"></label>
      <label class="grow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="4.5" width="17" height="16" rx="4"/><path d="M3.5 9.5h17M8 2.5v4M16 2.5v4"/></svg><span id="dateLbl">Giorno</span><input type="date" id="fDate"></label>
      <label class="grow" id="rowStart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>Inizio</span><input type="time" id="fStart"></label>

        <select id="fRep"><option value="none">Mai</option><option value="day">Ogni giorno</option><option value="week">Ogni settimana</option><option value="month">Ogni mese</option><option value="year">Ogni anno</option></select></label>
      <label class="grow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0112 0c0 5 2 6.5 2 6.5H4S6 14 6 9z"/><path d="M10 19.5a2 2 0 004 0"/></svg><span>Avviso</span>

    </div>
    <span class="lab">Note</span>
    <textarea class="in" id="fNote" rows="3" placeholder="Facoltativo"></textarea>
    <div class="acts">
      <button type="button" class="btn del" id="edDel" hidden>Elimina</button>
      <button type="submit" class="btn pri">Salva</button>
    </div>
    <button type="button" class="btn ghost" id="edIcs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="4.5" width="17" height="16" rx="4"/><path d="M3.5 9.5h17M8 2.5v4M16 2.5v4M12 12.5v5M9.5 15h5"/></svg>Salva e aggiungi al Calendario iPhone</button>

  <div class="sheet" id="cliSheet"></div>
</div>

  <form class="sheet" id="ce" autocomplete="off" novalidate>

    <div class="group">
      <label class="grow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2"/></svg><input class="txt" id="cPhone" type="tel" placeholder="Telefono"></label>
      <label class="grow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><input class="txt" id="cEmail" type="email" placeholder="Email"></label>
      <label class="grow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v3M5 21v-7a2 2 0 012-2h10a2 2 0 012 2v7M3 21h18M5 16c2 0 2-1.5 3.5-1.5S10 16 12 16s2-1.5 3.5-1.5S17 16 19 16"/></svg><input class="txt" id="cBirth" type="number" inputmode="numeric" placeholder="Anno di nascita" min="1920" max="2025"></label>
      <label class="grow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8.5 7V5.5a2 2 0 012-2h3a2 2 0 012 2V7"/></svg><input class="txt" id="cJob" placeholder="Professione"></label>
      <label class="grow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0114 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><input class="txt" id="cCity" placeholder="Città / zona"></label>
    </div>

      <p>Eliminare il cliente? Gli appuntamenti restano in agenda.</p>
      <div class="acts"><button type="button" class="btn warn" id="ceDelYes">Elimina</button><button type="button" class="btn" id="ceDelNo">Annulla</button></div>
    </div>
  </form>
</div>

<!-- menu -->
<div class="scrim" id="menuScrim" hidden>
  <div class="sheet menu">
    <div class="grab"></div>
    <div class="shead"><h3>Impostazioni</h3><button type="button" id="menuClose">Chiudi</button></div>
    <button class="btn" id="notifBtn"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0112 0c0 5 2 6.5 2 6.5H4S6 14 6 9z"/><path d="M10 19.5a2 2 0 004 0"/></svg></span><span>Notifiche<small id="notifTxt">Avvisi degli appuntamenti mentre l'app è aperta</small></span><span class="status off" id="notifSt">Spente</span></button>
    <button class="btn" id="icsAllBtn"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="4.5" width="17" height="16" rx="4"/><path d="M3.5 9.5h17M8 2.5v4M16 2.5v4"/></svg></span><span>Copia nel Calendario iPhone<small id="icsTxt">Così gli avvisi suonano anche ad app chiusa</small></span></button>
    <button class="btn" id="expBtn"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg></span><span>Salva una copia di sicurezza<small id="expTxt">Un file con tutti i dati, da tenere su File o iCloud</small></span></button>
    <button class="btn" id="impBtn"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9M7 14l5-5 5 5M4 4h16"/></svg></span><span>Ripristina da una copia<small>Carica un file di backup salvato prima</small></span></button>
    <input type="file" id="impFile" accept="application/json,.json" hidden>
    <button class="btn danger" id="wipeBtn"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></span><span>Cancella tutti i dati<small>Svuota agenda e clienti su questo telefono</small></span></button>
    <div class="confirm" id="wipeBox" hidden>
      <p>Cancellare tutto? Non si può annullare.</p>

<div class="alarm" id="alarm" role="alert" hidden><span class="ic"></span><div class="b"><b id="alT"></b><span id="alS"></span></div><button id="alOk">OK</button></div>
<div id="toast" role="status"></div>

<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmt=(d,o)=>new Intl.DateTimeFormat("it-IT",o).format(d);
const mins=hm=>{const [h,m]=hm.split(":").map(Number);return h*60+m};
const hm=t=>`${pad(Math.floor(t/60))}:${pad(t%60)}`;
const durTxt=m=>{ if(m<=0) return ""; const h=Math.floor(m/60), r=m%60; return h?(r?`${h} h ${r}`:`${h} h`):`${r} min`; };
const shortD=ds=>fmt(parse(ds),{day:"numeric",month:"short"});

const S='viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
const ICON={
  personale:`<svg ${S}><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>`,
  lavoro:`<svg ${S}><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8.5 7V5.5a2 2 0 012-2h3a2 2 0 012 2V7M3 12.5h18"/></svg>`,
  famiglia:`<svg ${S}><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0112 7.3 4.3 4.3 0 0119.5 10c0 5.4-7.5 10-7.5 10z"/></svg>`,
  amici:`<svg ${S}><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0113 0"/><path d="M16 4.6a3.5 3.5 0 010 6.8M18.5 14a6.5 6.5 0 013 6"/></svg>`,
  salute:`<svg ${S}><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>`,
  sport:`<svg ${S}><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>`,
  casa:`<svg ${S}><path d="M3.5 10.5L12 3.5l8.5 7V20a1 1 0 01-1 1h-15a1 1 0 01-1-1z"/><path d="M9.5 21v-6h5v6"/></svg>`,
  altro:`<svg ${S}><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></svg>`,
};
const PIN=`<svg ${S}><path d="M12 21s-7-6.2-7-11.5a7 7 0 0114 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>`;
const REP=`<svg ${S}><path d="M17 2.5l3 3-3 3"/><path d="M4 11.5v-1a5 5 0 015-5h11"/></svg>`;
const BELL=`<svg ${S}><path d="M6 9a6 6 0 0112 0c0 5 2 6.5 2 6.5H4S6 14 6 9z"/><path d="M10 19.5a2 2 0 004 0"/></svg>`;
const NOTE=`<svg ${S}><path d="M5 4h14v16H5zM9 9h6M9 13h6"/></svg>`;
const USER=`<svg ${S}><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>`;
const PHONE=`<svg ${S}><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2"/></svg>`;
const CHAT=`<svg ${S}><path d="M20 12a8 8 0 01-11.6 7.1L4 20l1-4.2A8 8 0 1120 12z"/></svg>`;
const CHECK=`<svg ${S}><path d="M4 12.5l5 5L20 6.5"/></svg>`;
const PLUS=`<svg ${S}><path d="M12 5v14M5 12h14"/></svg>`;
const CHEV=`<svg ${S} class="chev"><path d="M9 6l6 6-6 6"/></svg>`;
const SEARCH=`<svg ${S}><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>`;
const BRIEF=`<svg ${S}><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8.5 7V5.5a2 2 0 012-2h3a2 2 0 012 2V7"/></svg>`;

const CATS=[["personale","Personale"],["lavoro","Lavoro"],["famiglia","Famiglia"],["amici","Amici"],["salute","Salute"],["sport","Sport"],["casa","Casa"],["altro","Altro"]];
const TEMI=[["previdenza","Previdenza",40],["tcm","Protezione TCM",45],["ltc","LTC",45],["risparmio","Risparmio / PAC",45],["casa","Progetto Casa",60],["salute","Salute e infortuni",40],["forense","Cassa Forense",60],["altro","Altro",60]];
const SEDI=[["","—"],["venezia","Venezia · Palazzo Regina Vittoria"],["mestre","Mestre · Galleria del Teatro Vecchio 6"],["cliente","Dal cliente"],["remoto","Telefono / video"]];
const SEDE_PLACE={venezia:"Palazzo Regina Vittoria, Venezia",mestre:"Galleria del Teatro Vecchio 6, Mestre",cliente:"Dal cliente",remoto:"Telefono / video"};
const ESITI=[["","Da registrare"],["interessato","Interessato"],["preventivo","Preventivo da fare"],["richiamare","Da richiamare"],["chiuso","Chiuso ✓"],["no","Non interessato"]];
const ESITO_CLS={interessato:"wait",preventivo:"wait",richiamare:"wait",chiuso:"ok",no:"no"};
const temaName=k=>(TEMI.find(t=>t[0]===k)||[0,""])[1];
const esitoName=k=>(ESITI.find(t=>t[0]===k)||[0,""])[1];
const ck=c=>CATS.some(x=>x[0]===c)?c:"altro";
const kv=c=>`--k:var(--c-${ck(c)})`;
const icon=c=>`<span class="ic">${ICON[ck(c)]}</span>`;
const isWork=e=>ck(e.cat)==="lavoro";

/* ---------- dati ---------- */
const KEY="agenda.v1";
let DB={events:[],tasks:[],notes:{},notesW:{},clients:[]};
function normalize(p){ return {events:p.events||[],tasks:(p.tasks||[]).map(t=>({area:"personale",...t})),notes:p.notes||{},notesW:p.notesW||{},clients:p.clients||[]}; }
try{ const raw=localStorage.getItem(KEY); if(raw) DB=normalize(JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(DB)); }catch(e){ toast("Memoria piena o non disponibile: dati non salvati"); } }
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
const client=id=>DB.clients.find(c=>c.id===id);

/* ---------- stato ---------- */
const ls=(k,d)=>{ try{ return localStorage.getItem(k)||d; }catch(e){ return d; } };
const lss=(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} };
let sel=ymd(new Date());
let view=ls("agenda.view","giorno");
let AREA=ls("agenda.area","tutto");
let clientQuery="";
const todayS=()=>ymd(new Date());
function isoWeek(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y0)/864e5+1)/7); }
function weekStart(d){ const x=new Date(d); const k=(x.getDay()+6)%7; x.setDate(x.getDate()-k); return x; }

function occurs(ev,ds){
  if(ds<ev.date) return false;
  if(ev.skip&&ev.skip.includes(ds)) return false;
  if(!ev.rep||ev.rep==="none") return ds===ev.date;
  const a=parse(ev.date), b=parse(ds);
  switch(ev.rep){
    case "day": return true;
    case "week": return a.getDay()===b.getDay();
    case "month": return a.getDate()===b.getDate();
    case "year": return a.getDate()===b.getDate()&&a.getMonth()===b.getMonth();
  }
  return false;
}
const inArea=e=>AREA==="tutto"||(AREA==="lavoro")===isWork(e);
const taskInArea=t=>AREA==="tutto"||t.area===AREA;
function eventsAll(ds){
  return DB.events.filter(e=>occurs(e,ds)).sort((x,y)=>(x.allDay===y.allDay?0:x.allDay?-1:1)||(x.start||"").localeCompare(y.start||"")||(x.title||"").localeCompare(y.title||""));
}
const eventsOn=ds=>eventsAll(ds).filter(inArea);
const tasksOn=ds=>DB.tasks.filter(t=>t.date===ds&&taskInArea(t));
const overdue=today=>DB.tasks.filter(t=>!t.done&&t.date<today&&taskInArea(t)).sort((a,b)=>a.date.localeCompare(b.date));
const evTitle=e=>e.title||(e.clientId&&client(e.clientId)?`${temaName(e.tema)||"Appuntamento"} · ${client(e.clientId).name}`:"Senza titolo");

/* ---------- render ---------- */
function render(anim){
  const d=parse(sel);
  $("#monthBtn").innerHTML=view==="clienti"?`<b>Clienti</b><span>${DB.clients.length}</span>`:`<b>${esc(fmt(d,{month:"long"}))}</b><span>${d.getFullYear()}</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>`;
  document.querySelectorAll(".tab[data-v]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===view?"true":"false"));
  document.querySelectorAll(".area button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.a===AREA?"true":"false"));
  $(".area").hidden=view==="clienti";
  $("#todayBtn").hidden=view==="clienti";
  $("#todayBtn").classList.toggle("on",sel!==todayS());
  $("#week").hidden=view==="mese"||view==="clienti";
  if(!$("#week").hidden) renderWeekStrip(d);
  if(view==="giorno") renderDay(d); else if(view==="settimana") renderWeek(d); else if(view==="mese") renderMonth(d); else renderClients();
  if(anim){ const v=$("#view"); v.classList.remove("fade"); void v.offsetWidth; v.classList.add("fade"); }
}
function dotsFor(ds,max){
  const cats=[...new Set(eventsOn(ds).map(e=>ck(e.cat)))].slice(0,max);
  return cats.map(c=>`<i style="background:var(--c-${c})"></i>`).join("");
}
function renderWeekStrip(d){
  const s=weekStart(d), t=todayS(); let h="";
  for(let i=0;i<7;i++){ const x=addDays(s,i), ds=ymd(x);
    h+=`<button class="wd${ds===t?" today":""}${ds===sel?" sel":""}" data-d="${ds}" aria-label="${esc(fmt(x,{weekday:"long",day:"numeric",month:"long"}))}">
      <span class="d">${esc(fmt(x,{weekday:"short"}).slice(0,3))}</span><span class="n">${x.getDate()}</span><span class="dots">${dotsFor(ds,3)}</span></button>`; }
  $("#week").innerHTML=h;
}
function coverStyle(isToday,isPast){
  if(AREA==="lavoro"&&isToday){ const h=new Date().getHours(); if(h>=7&&h<20) return ["#2e4d74","#17304f","Giornata di lavoro",false]; }
  if(!isToday) return isPast?["#5b6a66","#3f4c49","Giorno passato",false]:["#0f7a68","#0b4f60","In arrivo",false];
  const h=new Date().getHours();
  if(h>=5&&h<8)  return ["#ef8a54","#c4497a","Alba",false];
  if(h>=8&&h<17) return ["#1d9a86","#1b6fa8","Buona giornata",false];
  if(h>=17&&h<20) return ["#e7643a","#8e3d8f","Tramonto",false];
  return ["#1d2b5c","#3a2f78","Buonanotte",true];
}
const needsOutcome=(e,ds,nowHM)=>isWork(e)&&e.clientId&&!e.esito&&(ds<todayS()||(ds===todayS()&&(e.end||e.start||"99")<=nowHM));
function evSub(e){
  const c=e.clientId&&client(e.clientId);
  return [c&&e.title?`<span>${USER}${esc(c.name)}</span>`:"",e.place?`<span>${PIN}${esc(e.place)}</span>`:"",e.rep&&e.rep!=="none"?`<span>${REP}${({day:"ogni giorno",week:"ogni settimana",month:"ogni mese",year:"ogni anno"}[e.rep])}</span>`:"",
    e.alert!=null&&e.alert>=0?`<span>${BELL}${alertTxt(e.alert)}</span>`:"",e.note?`<span>${NOTE}${esc(e.note.length>50?e.note.slice(0,50)+"…":e.note)}</span>`:""].join("");
}
function evTags(e,ds,nowHM){
  const t=[]; if(e.tema) t.push(`<span class="tag2">${esc(temaName(e.tema))}</span>`);
  if(e.esito) t.push(`<span class="tag2 ${ESITO_CLS[e.esito]||""}">${esc(esitoName(e.esito))}</span>`);
  else if(needsOutcome(e,ds,nowHM)) t.push(`<span class="tag2 need">Registra esito</span>`);
  return t.length?`<div class="tags">${t.join("")}</div>`:"";
}

function renderDay(d){
  const ds=ymd(d), t=todayS(), isToday=ds===t, isPast=ds<t;
  const y=d.getFullYear(); const doy=Math.round((Date.UTC(y,d.getMonth(),d.getDate())-Date.UTC(y,0,1))/864e5)+1;
  const tot=(y%4===0&&y%100!==0)||y%400===0?366:365;
  const diff=Math.round((parse(ds)-parse(t))/864e5);
  const rel=diff===0?"Oggi":diff===1?"Domani":diff===-1?"Ieri":diff>0?`Tra ${diff} giorni`:`${-diff} giorni fa`;
  const now=new Date(), nowHM=`${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const evs=eventsOn(ds), all=evs.filter(e=>e.allDay), timed=evs.filter(e=>!e.allDay);
  const od=isToday?overdue(t):[];
  const tk=tasksOn(ds).sort((a,b)=>(a.done-b.done));
  const totT=tk.length+od.length, doneT=tk.filter(x=>x.done).length, left=totT-doneT;
  const [g1,g2,label,night]=coverStyle(isToday,isPast);
  const C=2*Math.PI*34, frac=totT?doneT/totT:0;
  const areaTag=AREA==="tutto"?"":`<em>${AREA==="lavoro"?"Lavoro":"Personale"}</em>`;

  const cover=`<section class="cover" style="--g:linear-gradient(140deg,${g1},${g2});--g1:${g1}">${night?'<div class="stars"></div>':""}
    <div class="eyebrow">${rel} · ${label} ${areaTag}</div>
    <div class="main"><div><div class="big">${d.getDate()}</div><div class="wk">${esc(fmt(d,{weekday:"long"}))}</div><div class="my">${esc(fmt(d,{month:"long",year:"numeric"}))}</div></div>
      <div class="ring" aria-label="${doneT} su ${totT} cose fatte"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="34" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="7"/>
        <circle cx="40" cy="40" r="34" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}" style="transition:stroke-dashoffset .5s"/></svg>
        <div class="lbl"><div><b>${totT?`${doneT}/${totT}`:"—"}</b><small>fatte</small></div></div></div></div>
    <div class="chips"><span>${evs.length} ${evs.length===1?"impegno":"impegni"}</span><span>${left} da fare</span><span>Sett. ${isoWeek(d)}</span><span>${doy}° · −${tot-doy}</span></div>
  </section>`;

  const alld=all.length?`<div class="allday">${all.map(e=>`<button class="ad tint" style="${kv(e.cat)}" data-ev="${e.id}" data-ds="${ds}">${icon(e.cat)}<span class="ti">${esc(evTitle(e))}</span><span class="tag">${e.rep==="year"?"Ricorrenza":"Tutto il giorno"}</span></button>`).join("")}</div>`:"";
  let tl="";
  if(!timed.length&&!all.length) tl=`<button class="empty" data-new="${ds}"><svg ${S}><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg><b>${AREA==="lavoro"?"Nessun appuntamento di lavoro":"Giornata libera"}</b>Tocca per aggiungere</button>`;
  else if(timed.length){
    const rows=[]; let nowPlaced=!isToday, prevEnd=null;
    for(const e of timed){
      const st=mins(e.start), en=e.end?Math.max(st,mins(e.end)):st;
      if(prevEnd!==null&&st-prevEnd>=30) rows.push({gap:st-prevEnd});
      if(!nowPlaced&&e.start>nowHM){ rows.push({now:true}); nowPlaced=true; }
      rows.push({e,past:isPast||(isToday&&(e.end||e.start)<nowHM)});
      prevEnd=Math.max(prevEnd??0,en);
    }
    if(!nowPlaced) rows.push({now:true});
    tl=`<div class="tl">`+rows.map((r,i)=>{
      const fl=(i===0?" first":"")+(i===rows.length-1?" last":"");
      if(r.gap) return `<div></div><div class="rail${fl}"></div><div class="gap">Libero · ${durTxt(r.gap)}</div>`;
      if(r.now) return `<div class="time nowt">${nowHM}</div><div class="rail nowr${fl}"><i></i></div><div class="nowline"><span>Adesso</span></div>`;
      const e=r.e, du=e.end?mins(e.end)-mins(e.start):0, sub=evSub(e);
      return `<div class="time${r.past?" past":""}">${esc(e.start)}${e.end?`<small>${esc(e.end)}</small>`:""}</div>
        <div class="rail${fl}${r.past?" past":""}" style="${kv(e.cat)}"><i></i></div>
        <div class="${r.past?"past":""}"><button class="card tint" style="${kv(e.cat)}" data-ev="${e.id}" data-ds="${ds}">${icon(e.cat)}<span class="b"><div class="ti">${esc(evTitle(e))}</div>${sub?`<div class="sub">${sub}</div>`:""}${evTags(e,ds,nowHM)}</span>${du>0?`<span class="dur">${durTxt(du)}</span>`:""}</button></div>`;
    }).join("")+`</div>`;
  }
  const taskHtml=[...od.map(x=>taskRow(x,"over")),...tk.map(x=>taskRow(x,""))].join("");
  const noteKey=AREA==="lavoro"?"notesW":"notes";

  $("#addTask").onsubmit=e=>{ e.preventDefault(); const v=$("#taskIn").value.trim(); if(!v) return; DB.tasks.push({id:uid(),text:v,date:ds,done:false,area:AREA==="tutto"?ls("agenda.addArea","personale"):AREA}); save(); render(); setTimeout(()=>$("#taskIn")&&$("#taskIn").focus(),0); };

function taskRow(x,kind){
  const c=x.clientId&&client(x.clientId);
  const from=kind==="over"?`<span class="from">${esc(shortD(x.date))}</span>`:kind==="fut"?`<span class="from fut">${esc(shortD(x.date))}</span>`:"";
  const wk=AREA==="tutto"&&x.area==="lavoro"&&!c?`<span class="wk">${BRIEF}</span>`:"";
  return `<div class="task${x.done?" done":""}"><input type="checkbox" data-tk="${x.id}" ${x.done?"checked":""} aria-label="Fatto"><span class="tx"><span>${esc(x.text)}</span>${c?`<small><button type="button" data-cli="${c.id}">${esc(c.name)}</button></small>`:""}</span>${wk}${from}<button class="x" data-tx="${x.id}" aria-label="Elimina">×</button></div>`;
}

function renderWeek(d){
  const s=weekStart(d), t=todayS(), e7=addDays(s,6);
  let n=0,work=0,closed=0;
  for(let i=0;i<7;i++){ const evs=eventsOn(ymd(addDays(s,i))); n+=evs.length; evs.forEach(e=>{ if(isWork(e)){ work++; if(e.esito==="chiuso") closed++; } }); }
  let h=`<h2 style="margin-top:6px">Settimana ${isoWeek(d)} <small>${esc(fmt(s,{day:"numeric",month:"short"}))} – ${esc(fmt(e7,{day:"numeric",month:"short"}))}</small></h2>`;
  if(AREA!=="personale") h+=`<div class="wsum"><div><b>${AREA==="lavoro"?work:n}</b><span>${AREA==="lavoro"?"appuntamenti":"impegni"}</span></div><div><b>${work}</b><span>di lavoro</span></div><div><b>${closed}</b><span>chiusi</span></div></div><div style="height:10px"></div>`;
  h+=`<div class="wkl">`;
  for(let i=0;i<7;i++){
    const x=addDays(s,i), ds=ymd(x), evs=eventsOn(ds), tk=tasksOn(ds).filter(z=>!z.done).length;
    const its=evs.map(e=>`<div class="it" style="${kv(e.cat)}"><i></i><b>${e.allDay?"Tutto il g.":esc(e.start)}</b><span>${esc(evTitle(e))}</span></div>`).join("")||`<div class="free">Libero</div>`;
    h+=`<button class="wkday${ds===t?" today":""}${i>=5?" weekend":""}" data-go="${ds}"><div class="num">${x.getDate()}<small>${esc(fmt(x,{weekday:"short"}))}</small></div>
      <div class="its">${its}${tk?`<div class="tc">${tk} da fare</div>`:""}</div></button>`;
  }
  $("#view").innerHTML=h+"</div>";
}

function renderMonth(d){
  const y=d.getFullYear(), m=d.getMonth(), first=new Date(y,m,1), start=weekStart(first), t=todayS();
  let h=`<div class="mhead">${["Lun","Mar","Mer","Gio","Ven","Sab","Dom"].map(x=>`<div>${x}</div>`).join("")}</div><div class="mgrid">`;
  for(let i=0;i<42;i++){
    const x=addDays(start,i); if(i>=35&&x.getMonth()!==m) break;
    const ds=ymd(x), evs=eventsOn(ds);
    h+=`<button class="mc${x.getMonth()!==m?" out":""}${ds===t?" today":""}${ds===sel?" sel":""}" data-pick="${ds}" aria-label="${esc(fmt(x,{day:"numeric",month:"long"}))}, ${evs.length} impegni"><span class="n">${x.getDate()}</span><span class="bars">${evs.slice(0,3).map(e=>`<i style="${kv(e.cat)}"></i>`).join("")}</span>${evs.length>3?`<span class="more">+${evs.length-3}</span>`:""}</button>`;
  }
  h+="</div>";
  const evs=eventsOn(sel), sd=parse(sel);
  h+=`<h2>${esc(fmt(sd,{weekday:"long",day:"numeric"}))} <button data-go="${sel}">Apri giorno</button></h2><div class="mlist">`;
  h+=evs.length?evs.map(e=>`<button class="mrow tint" style="${kv(e.cat)}" data-ev="${e.id}" data-ds="${sel}">${icon(e.cat)}<span class="ti">${esc(evTitle(e))}</span><span class="tm">${e.allDay?"Giornata":esc(e.start)+(e.end?"–"+esc(e.end):"")}</span></button>`).join("")
    :`<button class="empty" data-new="${sel}"><b>Giornata libera</b>Tocca per aggiungere</button>`;
  $("#view").innerHTML=h+"</div>";
}

/* ---------- clienti ---------- */
const initials=n=>n.trim().split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase()||"?";
const avColor=id=>{ const cs=["lavoro","personale","famiglia","sport","casa","salute","amici"]; let h=0; for(const ch of id) h=(h*31+ch.charCodeAt(0))>>>0; return `var(--c-${cs[h%cs.length]})`; };
const cliEvents=id=>DB.events.filter(e=>e.clientId===id).sort((a,b)=>(a.date+(a.start||"")).localeCompare(b.date+(b.start||"")));
function nextOcc(e){ // prossima data dell'evento da oggi (max 400 giorni)
  const t=parse(todayS()); for(let i=0;i<400;i++){ const ds=ymd(addDays(t,i)); if(occurs(e,ds)) return ds; } return null; }
function cliNext(id){ const t=todayS(), now=new Date(), nhm=`${pad(now.getHours())}:${pad(now.getMinutes())}`;
  let best=null; for(const e of cliEvents(id)){ const ds=nextOcc(e); if(!ds) continue; if(ds===t&&!e.allDay&&(e.end||e.start)<nhm) continue; const k=ds+(e.start||""); if(!best||k<best.k) best={e,ds,k}; } return best; }
function cliLast(id){ const t=todayS(); const past=cliEvents(id).filter(e=>e.date<=t); return past[past.length-1]||null; }
const waLink=(p,txt)=>{ let d=(p||"").replace(/\D/g,""); if(d.startsWith("00")) d=d.slice(2); if(d.length===10&&d[0]==="3") d="39"+d; return `https://wa.me/${d}${txt?`?text=${encodeURIComponent(txt)}`:""}`; };
const telLink=p=>`tel:${(p||"").replace(/[^\d+]/g,"")}`;

      return `<div class="callb${late?" late":""}"><span class="av" style="background:${avColor(c.id)}">${esc(initials(c.name))}</span><div class="b" data-cli="${c.id}"><b>${esc(c.name)}</b><span>${esc(x.text)} · ${late?`in ritardo dal ${esc(shortD(x.date))}`:tod?"oggi":esc(shortD(x.date))}</span></div>
        ${c.phone?`<a class="mini" href="${telLink(c.phone)}" aria-label="Chiama ${esc(c.name)}">${PHONE}</a>`:""}<button class="mini" data-tkdone="${x.id}" aria-label="Fatto">${CHECK}</button></div>`; }).join("");

  else if(!list.length) h+=`<div class="empty"><b>Nessun risultato</b>Prova con un altro nome</div>`;
  else{
    let last=""; h+="";
    const groups={}; list.forEach(c=>{ const L=(c.name[0]||"#").toUpperCase(); (groups[L]=groups[L]||[]).push(c); });
    for(const L of Object.keys(groups)){
      h+=`<div class="letter">${esc(L)}</div><div class="clist">`+groups[L].map(c=>{ const nx=cliNext(c.id), ls_=cliLast(c.id);
        const sub=nx?`Prossimo: ${esc(shortD(nx.ds))}${nx.e.start?` alle ${esc(nx.e.start)}`:""}`:ls_?`Ultimo: ${esc(shortD(ls_.date))}${ls_.esito?` · ${esc(esitoName(ls_.esito))}`:""}`:esc([c.job,c.city].filter(Boolean).join(" · ")||c.phone||"Nessun appuntamento");
        return `<button class="crow" data-cli="${c.id}"><span class="av" style="background:${avColor(c.id)}">${esc(initials(c.name))}</span><span class="b"><b>${esc(c.name)}</b><span>${sub}</span></span>${CHEV}</button>`; }).join("")+`</div>`;
    }
  }
  $("#view").innerHTML=h;
  const cq=$("#cq"); cq.oninput=()=>{ clientQuery=cq.value; const pos=cq.selectionStart; renderClients(); const n=$("#cq"); n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){} };
  const nb=()=>openClientEditor(null); if($("#newCli")) $("#newCli").onclick=nb; if($("#newCli2")) $("#newCli2").onclick=nb;

    </div>
    ${c.note?`<span class="lab">Note</span><div class="info"><div style="display:block;white-space:pre-wrap">${esc(c.note)}</div></div>`:""}`;
  if(nx) h+=`<span class="lab">Prossimo appuntamento</span><div class="hist"><button class="mrow tint" style="${kv("lavoro")}" data-ev="${nx.e.id}" data-ds="${nx.ds}">${icon("lavoro")}<span class="ti">${esc(temaName(nx.e.tema)||evTitle(nx.e))}<br><small style="font-weight:500;color:var(--muted)">${esc(fmt(parse(nx.ds),{weekday:"long",day:"numeric",month:"long"}))}</small></span><span class="tm">${nx.e.allDay?"Giornata":esc(nx.e.start)}</span></button></div>`;
  if(tasks.length) h+=`<span class="lab">Da fare</span><div class="tasks">${tasks.map(x=>taskRow(x,!x.done&&x.date<t?"over":!x.done&&x.date>t?"fut":"")).join("")}</div>`;
  const nn=new Date(), nhm=`${pad(nn.getHours())}:${pad(nn.getMinutes())}`; const past=evs.filter(e=>e.date<t||(e.date===t&&(e.allDay||(e.end||e.start)<=nhm))).reverse();
  if(past.length) h+=`<span class="lab">Storico</span><div class="hist">${past.map(e=>`<button class="mrow tint" style="${kv("lavoro")}" data-ev="${e.id}" data-ds="${e.date}"><span class="b" style="flex:1;min-width:0"><span class="ti" style="display:block">${esc(temaName(e.tema)||evTitle(e))}</span><small style="color:var(--muted)">${esc(fmt(parse(e.date),{day:"numeric",month:"long",year:"numeric"}))}</small></span>${e.esito?`<span class="tag2 ${ESITO_CLS[e.esito]||""}">${esc(esitoName(e.esito))}</span>`:`<span class="tag2 need">Esito?</span>`}</button>`).join("")}</div>`;
  h+=`<div class="acts"><button type="button" class="btn" id="cliEdit">Modifica scheda</button></div>`;
  $("#cliSheet").innerHTML=h; $("#cliScrim").hidden=false;
  $("#cliClose").onclick=closeClient;

  $("#cliNewEv").onclick=()=>{ closeClient(); returnCli=id; openEditor(null,sel<todayS()?todayS():sel,{cat:"lavoro",clientId:id}); };

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-d],[data-go],[data-pick],[data-new],[data-ev],[data-tx],[data-cli],[data-tkdone]"); if(!b) return;
  if(b.dataset.d){ sel=b.dataset.d; render(true); }
  else if(b.dataset.go){ sel=b.dataset.go; setView("giorno"); }
  else if(b.dataset.pick){ sel=b.dataset.pick; render(); }

  else if(b.dataset.cli){ openClient(b.dataset.cli); }
  else if(b.dataset.tkdone){ const t=DB.tasks.find(x=>x.id===b.dataset.tkdone); if(t){ t.done=true; save(); render(); toast("Fatto",()=>{ t.done=false; save(); render(); }); } }
  else if(b.dataset.tx){ const i=DB.tasks.findIndex(x=>x.id===b.dataset.tx); if(i>=0){ const [rm]=DB.tasks.splice(i,1); save(); render(); if(openCli) openClient(openCli); toast("Eliminato",()=>{ DB.tasks.push(rm); save(); render(); if(openCli) openClient(openCli); }); } }
});
document.addEventListener("change",e=>{

function setView(v){ view=v; lss("agenda.view",v); render(true); window.scrollTo({top:0}); }
document.querySelectorAll(".tab[data-v]").forEach(b=>b.onclick=()=>setView(b.dataset.v));
document.querySelectorAll(".area button").forEach(b=>b.onclick=()=>{ AREA=b.dataset.a; lss("agenda.area",AREA); render(true); });
$("#monthBtn").onclick=()=>{ if(view!=="clienti") setView(view==="mese"?"giorno":"mese"); };

function shift(dir){
  if(view==="clienti") return;
  const d=parse(sel);
  if(view==="giorno") sel=ymd(addDays(d,dir));
  else if(view==="settimana") sel=ymd(addDays(d,7*dir));
  else sel=ymd(new Date(d.getFullYear(),d.getMonth()+dir,1));
  render(true);
}
const anySheet=()=>!$("#edScrim").hidden||!$("#menuScrim").hidden||!$("#cliScrim").hidden||!$("#ceScrim").hidden;
let sx=0,sy=0,st=0;
document.body.addEventListener("touchstart",e=>{ if(anySheet()) return; const t=e.touches[0]; sx=t.clientX; sy=t.clientY; st=1; },{passive:true});
document.body.addEventListener("touchend",e=>{ if(!st) return; st=0; const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy; const tag=(e.target.tagName||"").toLowerCase();
  if(tag==="textarea"||tag==="input") return;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.6) shift(dx<0?1:-1); },{passive:true});
document.addEventListener("keydown",e=>{ if(e.target.matches("input,textarea,select")||anySheet()) return; if(e.key==="ArrowLeft") shift(-1); if(e.key==="ArrowRight") shift(1); });

let editing=null, editDs=null, cat="personale", returnCli=null;
function renderCats(){ $("#fCats").innerHTML=CATS.map(([k,l])=>`<button type="button" class="cat" style="${kv(k)}" data-cat="${k}" aria-pressed="${k===cat}">${icon(k)}${l}</button>`).join(""); }
