$("#fCats").onclick=e=>{ const b=e.target.closest("[data-cat]"); if(!b) return; cat=b.dataset.cat; renderCats(); setWork(); };
function addMin(h,m){ const t=Math.min(23*60+59,mins(h)+m); return hm(t); }
const addHour=h=>addMin(h,60);
function setTimeRows(){ const a=$("#fAll").checked; $("#rowStart").hidden=a; $("#rowEnd").hidden=a; }
function fillWorkSelects(ev,pre){
  const cs=[...DB.clients].sort((a,b)=>a.name.localeCompare(b.name,"it"));
  $("#fClient").innerHTML=`<option value="">— nessuno —</option>`+cs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")+`<option value="__new">+ Nuovo cliente…</option>`;
  $("#fTema").innerHTML=`<option value="">—</option>`+TEMI.map(([k,l])=>`<option value="${k}">${l}</option>`).join("");
  $("#fSede").innerHTML=SEDI.map(([k,l])=>`<option value="${k}">${l}</option>`).join("");
  $("#fEsito").innerHTML=ESITI.map(([k,l])=>`<option value="${k}">${l}</option>`).join("");
  $("#fClient").value=(ev&&ev.clientId)||(pre&&pre.clientId)||""; $("#fTema").value=(ev&&ev.tema)||""; $("#fSede").value=(ev&&ev.sede)||""; $("#fEsito").value=(ev&&ev.esito)||"";
  $("#newCliRow").hidden=$("#newCliRow2").hidden=true;
  $("#esitoRow").hidden=!ev;
}
$("#fClient").onchange=()=>{ const n=$("#fClient").value==="__new"; $("#newCliRow").hidden=$("#newCliRow2").hidden=!n; if(n) setTimeout(()=>$("#fNewName").focus(),50);
  const c=client($("#fClient").value); if(c&&c.interests&&c.interests.length===1&&!$("#fTema").value){ $("#fTema").value=c.interests[0]; $("#fTema").onchange(); } };
$("#fTema").onchange=()=>{ const t=TEMI.find(x=>x[0]===$("#fTema").value); if(t&&!editing&&!$("#fAll").checked&&$("#fStart").value) $("#fEnd").value=addMin($("#fStart").value,t[2]); };
$("#fSede").onchange=()=>{ const p=SEDE_PLACE[$("#fSede").value]; const cur=$("#fPlace").value.trim(); if(p&&(!cur||Object.values(SEDE_PLACE).includes(cur))) $("#fPlace").value=p; };

function openEditor(ev,ds,pre){
  editing=ev||null; editDs=ds;
  $("#edTitle").textContent=ev?"Modifica":"Nuovo appuntamento";
  const nh=`${pad(Math.min(23,new Date().getHours()+1))}:00`;
  $("#fTitle").value=ev?ev.title||"":"";
  $("#fAll").checked=ev?!!ev.allDay:false;
  $("#fDate").value=ev?ev.date:ds;
  $("#dateLbl").textContent=ev&&ev.rep&&ev.rep!=="none"?"Dal giorno":"Giorno";
  $("#fStart").value=ev&&!ev.allDay?ev.start:nh;
  $("#fEnd").value=ev&&!ev.allDay?(ev.end||""):addHour(nh);
  $("#fRep").value=ev?ev.rep||"none":"none";
  $("#fAlert").value=String(ev&&ev.alert!=null?ev.alert:15);
  $("#fPlace").value=ev?ev.place||"":""; $("#fNote").value=ev?ev.note||"":"";
  cat=ev?ck(ev.cat):(pre&&pre.cat)||(AREA==="lavoro"?"lavoro":"personale");
  renderCats(); fillWorkSelects(ev,pre); setWork(); setTimeRows();
  $("#edDel").hidden=!ev; $("#delBox").hidden=true;
  $("#edScrim").hidden=false; $("#ed").scrollTop=0;
  if(!ev&&!(pre&&pre.clientId)) setTimeout(()=>$("#fTitle").focus(),260);
}
$("#fAll").onchange=setTimeRows;
$("#fStart").onchange=()=>{ const s=$("#fStart").value, e=$("#fEnd").value; if(s&&(!e||e<=s)) $("#fEnd").value=addHour(s); };
const closeEd=(back=true)=>{ $("#edScrim").hidden=true; editing=null; if(back&&returnCli){ const id=returnCli; returnCli=null; openClient(id); } };
$("#edClose").onclick=()=>closeEd();
$("#edScrim").addEventListener("click",e=>{ if(e.target.id==="edScrim") closeEd(); });

function outcomeTasks(ev,old){
  if(!ev.clientId||!ev.esito||ev.esito===old) return "";
  const c=client(ev.clientId); if(!c) return "";
  const base=ev.date>todayS()?parse(ev.date):parse(todayS()), tema=temaName(ev.tema);
  let task=null;
  if(ev.esito==="richiamare") task={text:`Richiamare ${c.name}${tema?` (${tema})`:""}`,date:ymd(addDays(base,7))};
  if(ev.esito==="preventivo") task={text:`Preparare preventivo${tema?` ${tema}`:""} per ${c.name}`,date:ymd(addDays(base,1))};
  if(ev.esito==="interessato") task={text:`Ricontattare ${c.name}${tema?` per ${tema}`:""}`,date:ymd(addDays(base,14))};
  if(!task) return ev.esito==="chiuso"?"Ottimo lavoro! Contratto chiuso":"";
  DB.tasks.push({id:uid(),...task,done:false,area:"lavoro",clientId:c.id});
  return `Aggiunto "${task.text}" per il ${shortD(task.date)}`;
}
let wantIcs=false;
$("#ed").onsubmit=e=>{
  e.preventDefault();
  let clientId=cat==="lavoro"?$("#fClient").value:"";
  if(clientId==="__new"){ const n=$("#fNewName").value.trim(); if(!n){ $("#fNewName").focus(); toast("Scrivi il nome del nuovo cliente"); return; }
    const c={id:uid(),name:n,phone:$("#fNewPhone").value.trim(),created:todayS(),interests:$("#fTema").value&&$("#fTema").value!=="altro"?[$("#fTema").value]:[]}; DB.clients.push(c); clientId=c.id; }
  const title=$("#fTitle").value.trim();
  if(!title&&!clientId){ $("#fTitle").focus(); toast("Scrivi un titolo"); return; }
  const date=$("#fDate").value||editDs, allDay=$("#fAll").checked;
  let start=$("#fStart").value||"09:00", end=$("#fEnd").value; if(end&&end<start) end="";
  const data={title,date,allDay,start:allDay?"":start,end:allDay?"":end,cat,rep:$("#fRep").value,alert:+$("#fAlert").value,place:$("#fPlace").value.trim(),note:$("#fNote").value.trim()};
  if(cat==="lavoro") Object.assign(data,{clientId:clientId||undefined,tema:$("#fTema").value||undefined,sede:$("#fSede").value||undefined,esito:editing?($("#fEsito").value||undefined):undefined});
  else Object.assign(data,{clientId:undefined,tema:undefined,sede:undefined,esito:undefined});
  const was=!!editing, oldEsito=editing&&editing.esito; let saved=editing;
  if(editing) Object.assign(editing,data); else { saved={id:uid(),...data}; DB.events.push(saved); }
  Object.keys(saved).forEach(k=>saved[k]===undefined&&delete saved[k]);
  const msg=outcomeTasks(saved,oldEsito);
  save(); closeEd(); sel=date; if(view==="clienti"&&!clientId) view="giorno"; render(true);
  if(openCli) openClient(openCli);
  toast(msg||(was?"Modificato":"Salvato"));
  if(wantIcs){ wantIcs=false; openIcs(buildIcs([saved]),`${evTitle(saved).replace(/[^\w\- ]+/g,"").slice(0,30)||"evento"}.ics`); }
};
$("#edIcs").onclick=()=>{ wantIcs=true; $("#ed").requestSubmit?$("#ed").requestSubmit():$("#ed").dispatchEvent(new Event("submit",{cancelable:true})); };
$("#edDel").onclick=()=>{
  const ev=editing; if(!ev) return;
  const rec=ev.rep&&ev.rep!=="none";
  $("#delQ").textContent=rec?"Si ripete. Cosa vuoi eliminare?":"Eliminare questo appuntamento?";
  $("#delActs").innerHTML=rec?`<button type="button" class="btn warn" data-del="one">Solo il ${esc(fmt(parse(editDs),{day:"numeric",month:"long"}))}</button><button type="button" class="btn warn" data-del="all">Tutte le ripetizioni</button><button type="button" class="btn" data-del="no">Annulla</button>`
    :`<button type="button" class="btn warn" data-del="all">Elimina</button><button type="button" class="btn" data-del="no">Annulla</button>`;
  $("#delBox").hidden=false; $("#delBox").scrollIntoView({behavior:"smooth",block:"nearest"});
};
$("#delActs").onclick=e=>{
  const b=e.target.closest("[data-del]"); if(!b||!editing) return;
  const k=b.dataset.del, ev=editing;
  if(k==="no"){ $("#delBox").hidden=true; return; }
  const backup=JSON.parse(JSON.stringify(DB.events));
  if(k==="one") ev.skip=[...(ev.skip||[]),editDs]; else DB.events=DB.events.filter(x=>x.id!==ev.id);
  save(); closeEd(); render(); toast("Eliminato",()=>{ DB.events=backup; save(); render(); });
};

/* ---------- riepilogo giornata ---------- */
const alertTxt=a=>a===0?"all'ora":a<60?`${a} min prima`:a===60?"1 ora prima":a===1440?"1 giorno prima":`${a/60} ore prima`;
function brief(ds,timed,all,od,tk,nowHM){
  const h=new Date().getHours();
  const hello=h<5?"Buonanotte":h<13?"Buongiorno":h<18?"Buon pomeriggio":"Buonasera";
  const n=timed.length+all.length, work=[...timed,...all].filter(isWork).length;
  const next=timed.find(e=>e.start>=nowHM);
  const left=tk.filter(x=>!x.done).length+od.length;
  const calls=DB.tasks.filter(x=>!x.done&&x.clientId&&x.date<=ds).length;
  const noOut=AREA!=="personale"?DB.events.filter(e=>isWork(e)&&e.clientId&&!e.esito&&e.date<=ds&&e.date>=ymd(addDays(parse(ds),-14))&&needsOutcome(e,e.date,nowHM)).length:0;
  const p=[];
  const what=AREA==="lavoro"?["appuntamento di lavoro","appuntamenti di lavoro"]:["impegno","impegni"];
  if(!n) p.push(AREA==="lavoro"?"Oggi non hai appuntamenti di lavoro.":"Oggi non hai impegni in agenda.");
  else p.push(`Oggi hai <strong>${n} ${n===1?what[0]:what[1]}</strong>${AREA==="tutto"&&work?`, di cui ${work} di lavoro`:""}.`);
  if(next){ const m=mins(next.start)-mins(nowHM); p.push(`Il prossimo è <strong>${esc(evTitle(next))}</strong> alle ${esc(next.start)}${m>0?`, tra ${durTxt(m)}`:", adesso"}.`); }
  else if(timed.length) p.push("Gli appuntamenti di oggi sono finiti.");
  if(left) p.push(`Da fare: <strong>${left}</strong>${od.length?` (${od.length} dai giorni scorsi)`:""}.`);
  if(AREA!=="personale"&&calls) p.push(`Clienti da richiamare: <strong>${calls}</strong>.`);
  if(noOut) p.push(`Esiti da registrare: <strong>${noOut}</strong>.`);
  if(h>=17){ const tm=ymd(addDays(parse(ds),1)), te=eventsOn(tm); const f=te.find(e=>!e.allDay);
    p.push(te.length?`Domani: ${te.length} ${te.length===1?"impegno":"impegni"}${f?`, il primo alle ${esc(f.start)} (${esc(evTitle(f))})`:""}.`:"Domani hai la giornata libera."); }
  return `<div class="brief"><span class="ic"><svg ${S}><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg></span><div><b>${hello}</b><p>${p.join(" ")}</p></div></div>`;
}

/* ---------- avvisi ---------- */
let FIRED={}; try{ FIRED=JSON.parse(localStorage.getItem("agenda.fired")||"{}"); }catch(e){}
function alertsBetween(a,b){
  const out=[]; const t0=parse(todayS());
  for(let k=-1;k<=2;k++){ const ds=ymd(addDays(t0,k));
    for(const e of eventsAll(ds)){ if(e.alert==null||e.alert<0) continue;
      const base=parse(ds); const [hh,mm]=(e.allDay?"09:00":e.start).split(":").map(Number); base.setHours(hh,mm,0,0);
      const at=base.getTime()-e.alert*60000; if(at>a&&at<=b) out.push({key:e.id+"|"+ds,at,e,ds,base}); } }
  return out.sort((x,y)=>x.at-y.at);
}
function nextAlert(){ const n=Date.now(); return alertsBetween(n,n+3*864e5).find(x=>!FIRED[x.key]); }
let actx=null;
function chime(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const t=actx.currentTime;
  [[0,880],[.18,1175],[.36,1568]].forEach(([d,f])=>{ const o=actx.createOscillator(),g=actx.createGain(); o.type="sine"; o.frequency.value=f; g.gain.setValueAtTime(0,t+d); g.gain.linearRampToValueAtTime(.22,t+d+.02); g.gain.exponentialRampToValueAtTime(.001,t+d+.5); o.connect(g).connect(actx.destination); o.start(t+d); o.stop(t+d+.55); }); }catch(e){} }
document.addEventListener("touchend",()=>{ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); }catch(e){} },{once:true});
function when(x){ const m=Math.round((x.base.getTime()-Date.now())/60000), e=x.e;
  const t=e.allDay?(x.ds===todayS()?"oggi":"domani"):`${x.ds===todayS()?"oggi":"domani"} alle ${e.start}`;
  return m>1?`Tra ${durTxt(m)} · ${t}`:m>=-1?`Adesso · ${t}`:`Iniziato ${durTxt(-m)} fa`; }
async function fire(x){
  FIRED[x.key]=Date.now(); lss("agenda.fired",JSON.stringify(FIRED));
  const body=when(x)+(x.e.place?` · ${x.e.place}`:"");
  $("#alarm .ic").innerHTML=BELL; $("#alT").textContent=evTitle(x.e); $("#alS").textContent=body; $("#alarm").hidden=false;
  chime(); try{ if(navigator.vibrate&&navigator.userActivation&&navigator.userActivation.hasBeenActive) navigator.vibrate([250,120,250]); }catch(e){}
  if("Notification" in window&&Notification.permission==="granted"){
    try{ const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration(); const o={body,tag:x.key,icon:"icon-192.png",badge:"icon-192.png"};
      if(reg) reg.showNotification(evTitle(x.e),o); else new Notification(evTitle(x.e),o); }catch(e){}
  }
}
$("#alOk").onclick=()=>{ $("#alarm").hidden=true; };
function checkAlerts(){
  const n=Date.now();
  for(const k in FIRED) if(n-FIRED[k]>4*864e5) delete FIRED[k];
  alertsBetween(n-60*60000,n).filter(x=>!FIRED[x.key]).forEach(fire);
}
setInterval(checkAlerts,15000); setTimeout(checkAlerts,1500);

function notifState(){
  const st=$("#notifSt"), tx=$("#notifTxt");
  if(!("Notification" in window)){ st.textContent="Non disponibili"; st.className="status off";
    tx.textContent=/iP(hone|ad)/.test(navigator.userAgent)&&!navigator.standalone?"Su iPhone aggiungi prima l'app alla schermata Home, poi riaprila da lì":"Questo browser non supporta le notifiche"; return; }
  const p=Notification.permission;
  st.textContent=p==="granted"?"Attive":p==="denied"?"Bloccate":"Spente"; st.className="status "+(p==="granted"?"on":"off");
  const nx=nextAlert();
  tx.textContent=p==="denied"?"Riattivale da Impostazioni › Notifiche › Agenda":nx?`Prossimo avviso: ${evTitle(nx.e)}, ${new Date(nx.at).toLocaleString("it-IT",{weekday:"short",hour:"2-digit",minute:"2-digit"})}`:"Avvisi degli appuntamenti mentre l'app è aperta";
}
$("#notifBtn").onclick=async()=>{
  if(!("Notification" in window)){ notifState(); toast("Aggiungi l'app alla Home e riaprila da lì"); return; }
  if(Notification.permission==="default"){ try{ await Notification.requestPermission(); }catch(e){} }
  notifState(); if(Notification.permission==="granted"){ toast("Notifiche attive"); chime(); }
};

/* ---------- Calendario iPhone (.ics) ---------- */
const icsEsc=s=>String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
const icsD=ds=>ds.replace(/-/g,"");
const icsDT=(ds,h)=>`${icsD(ds)}T${h.replace(":","")}00`;
function buildIcs(list){
  const now=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Agenda//IT","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  for(const e of list){
    const c=e.clientId&&client(e.clientId);
    L.push("BEGIN:VEVENT",`UID:${e.id}@agenda`,`DTSTAMP:${now}`,`SUMMARY:${icsEsc(evTitle(e))}`);
    if(e.allDay) L.push(`DTSTART;VALUE=DATE:${icsD(e.date)}`,`DTEND;VALUE=DATE:${icsD(ymd(addDays(parse(e.date),1)))}`);
    else { const end=e.end&&e.end>e.start?e.end:addHour(e.start); L.push(`DTSTART:${icsDT(e.date,e.start)}`,`DTEND:${icsDT(e.date,end)}`); }
    if(e.rep&&e.rep!=="none") L.push(`RRULE:FREQ=${{day:"DAILY",week:"WEEKLY",month:"MONTHLY",year:"YEARLY"}[e.rep]}`);
    (e.skip||[]).forEach(d=>L.push(e.allDay?`EXDATE;VALUE=DATE:${icsD(d)}`:`EXDATE:${icsDT(d,e.start)}`));
    if(e.place) L.push(`LOCATION:${icsEsc(e.place)}`);
    const desc=[c?`Cliente: ${c.name}${c.phone?` (${c.phone})`:""}`:"",e.tema?`Tema: ${temaName(e.tema)}`:"",e.note||""].filter(Boolean).join("\n");
    if(desc) L.push(`DESCRIPTION:${icsEsc(desc)}`);
    L.push(`CATEGORIES:${(CATS.find(x=>x[0]===ck(e.cat))||[0,"Altro"])[1]}`);
    if(e.alert!=null&&e.alert>=0){ const off=e.allDay?540-e.alert:-e.alert; L.push("BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${icsEsc(evTitle(e))}`,`TRIGGER:${off<0?"-":""}PT${Math.abs(off)}M`,"END:VALARM"); }
    L.push("END:VEVENT");
  }
  L.push("END:VCALENDAR"); return L.join("\r\n");
}
function openIcs(text,name){
  const blob=new Blob([text],{type:"text/calendar;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const w=window.open(url,"_blank");
  if(!w){ const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}
$("#icsAllBtn").onclick=()=>{ const list=DB.events.filter(inArea); if(!list.length){ toast("Nessun appuntamento da copiare"); return; } openIcs(buildIcs(list),"agenda.ics"); };

/* ---------- menu / backup ---------- */
$("#menuBtn").onclick=()=>{
  $("#stats").textContent=`${DB.events.length} appuntamenti · ${DB.clients.length} clienti · ${DB.tasks.length} cose da fare. I dati restano solo su questo telefono: salva una copia ogni tanto.`;
  $("#icsTxt").textContent=AREA==="tutto"?"Tutti gli appuntamenti, con i loro avvisi":`Solo quelli ${AREA==="lavoro"?"di lavoro":"personali"} (filtro attivo)`;
  const lb=ls("agenda.lastBackup",""); $("#expTxt").textContent=lb?`Ultima copia: ${shortD(lb)}`:"Non hai ancora salvato una copia";
  $("#wipeBox").hidden=true; notifState(); $("#menuScrim").hidden=false; };
$("#menuClose").onclick=()=>$("#menuScrim").hidden=true;
$("#menuScrim").addEventListener("click",e=>{ if(e.target.id==="menuScrim") $("#menuScrim").hidden=true; });
$("#expBtn").onclick=async()=>{
  const name=`agenda-backup-${todayS()}.json`;
  const blob=new Blob([JSON.stringify({app:"agenda",v:2,saved:new Date().toISOString(),...DB},null,1)],{type:"application/json"});
  const done=()=>{ lss("agenda.lastBackup",todayS()); $("#expTxt").textContent=`Ultima copia: ${shortD(todayS())}`; };
  try{ const file=new File([blob],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:"Backup agenda"}); done(); return; } }
  catch(e){ if(e.name==="AbortError") return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
  done(); toast("Copia salvata");
};
$("#impBtn").onclick=()=>$("#impFile").click();
$("#impFile").onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{ const p=JSON.parse(await f.text()); if(!Array.isArray(p.events)||!Array.isArray(p.tasks)) throw 0;
    DB=normalize(p); save(); $("#menuScrim").hidden=true; render(); toast(`Ripristinati ${DB.events.length} appuntamenti e ${DB.clients.length} clienti`);
  }catch(err){ toast("Questo file non è un backup dell'agenda"); }
  e.target.value="";
};
$("#wipeBtn").onclick=()=>{ $("#wipeBox").hidden=false; };
$("#wipeNo").onclick=()=>{ $("#wipeBox").hidden=true; };
$("#wipeYes").onclick=()=>{ DB=normalize({}); save(); $("#menuScrim").hidden=true; render(); toast("Agenda svuotata"); };

/* ---------- toast con annulla ---------- */
let tt;
function toast(msg,undo){
  const t=$("#toast"); t.innerHTML=esc(msg)+(undo?'<button type="button">Annulla</button>':""); t.className="show"+(undo?" act":"");
  if(undo) t.querySelector("button").onclick=()=>{ undo(); t.className=""; };
  clearTimeout(tt); tt=setTimeout(()=>t.className="",undo?5000:2600);
}

/* ---------- aggiornamento automatico ---------- */
let lastDay=todayS();
const busy=()=>anySheet()||["TEXTAREA","INPUT"].includes(document.activeElement.tagName);
setInterval(()=>{ const t=todayS(); if(t!==lastDay){ if(sel===lastDay) sel=t; lastDay=t; if(!busy()) render(); } else if(view==="giorno"&&sel===t&&!busy()) render(); },60000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ checkAlerts(); if(!busy()){ const t=todayS(); if(t!==lastDay){ sel=t; lastDay=t; } render(); } } });

if("serviceWorker" in navigator&&location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
window.__agenda={occurs,buildIcs,alertsBetween,DB:()=>DB};
render();
})();
